# This is a Declarative Automation Bundle definition for Nov_2026.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Nov_2026
  uuid: 86bee45d-6492-4a8a-bdf6-8a0244f48c34

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-34c25f79-df5d.cloud.databricks.com
    variables:
      catalog: banking
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-34c25f79-df5d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mishrasakshi389@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mishrasakshi389@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: banking
      schema: prod
    permissions:
      - user_name: mishrasakshi389@gmail.com
        level: CAN_MANAGE
